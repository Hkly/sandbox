<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox - Interactive Color Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏖️ Sandbox</h1>
        <p class="instructions">Click on any square to change its color!</p>
        <div class="theme-selector">
            <label for="themeSelect">Theme:</label>
            <select id="themeSelect">
                <option value="default">Purple Wave</option>
                <option value="ocean">Ocean Breeze</option>
                <option value="sunset">Sunset Glow</option>
                <option value="forest">Forest Green</option>
                <option value="candy">Candy Pop</option>
            </select>
        </div>
        <div class="sandbox-grid" id="sandboxGrid"></div>
        <button class="reset-btn" id="resetBtn">Reset All</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
