<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox - Interactive Color Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏖️ Sandbox</h1>
        <p class="instructions">Click on any square to change its color!</p>
        
        <div class="color-picker-section">
            <h2>Color Palette</h2>
            <div class="color-palette" id="colorPalette"></div>
            <div class="add-color-controls">
                <input type="color" id="colorInput" value="#FF5733">
                <button class="add-color-btn" id="addColorBtn">Add Color</button>
            </div>
        </div>
        
        <div class="sandbox-grid" id="sandboxGrid"></div>
        <button class="reset-btn" id="resetBtn">Reset All</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
